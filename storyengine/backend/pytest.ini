[pytest]
testpaths = tests
# One file with a broken import must show up as an ERROR in the summary,
# not abort the whole run and hide the other ~80 files' results.
addopts = --continue-on-collection-errors
# 3 test files have bare `async def test_*` without @pytest.mark.asyncio;
# auto mode runs them all under pytest-asyncio (see requirements-test.txt).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
